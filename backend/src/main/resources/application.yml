spring:
  application:
    name: stockhub-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockhub}
    username: ${DB_USERNAME:stockhub}
    password: ${DB_PASSWORD:stockhub}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/google/callback"

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%p","logger":"%c","message":"%m","traceId":"%X{traceId}"}%n'
  level:
    com.stockhub: INFO
    com.stockhub.ingestion: DEBUG
    org.springframework.security: WARN
    org.springframework.batch: INFO

stockhub:
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    access-token-expiry: ${JWT_ACCESS_EXPIRY:15m}
    refresh-token-expiry: ${JWT_REFRESH_EXPIRY:7d}
    issuer: stockhub-api

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,https://stockhub.vercel.app}

  ingestion:
    enabled: ${INGESTION_ENABLED:true}
    price-cron: "0 0 18 * * ?"
    fundamentals-cron: "0 0 2 * * ?"
    chunk-size: 50
    thread-pool-size: 5

  export:
    max-companies: 20
    max-years: 10
    timeout-seconds: 60
