spring:
  application:
    name: stockhub-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockhub}
    username: ${DB_USERNAME:stockhub}
    password: ${DB_PASSWORD:123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[jdbc.batch_size]": 50
        "[hibernate.order_inserts]": true
        "[hibernate.order_updates]": true
        "[hibernate.default_batch_fetch_size]": 100
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  jackson:
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%p","logger":"%c","message":"%m","traceId":"%X{traceId}"}%n'
  level:
    "[com.stockhub]": INFO
    "[com.stockhub.ingestion]": DEBUG
    "[org.springframework.security]": WARN
    "[org.springframework.batch]": INFO

stockhub:
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    access-token-expiry: ${JWT_ACCESS_EXPIRY:15m}
    refresh-token-expiry: ${JWT_REFRESH_EXPIRY:7d}
    issuer: stockhub-api

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,https://stockhub.vercel.app}

  ingestion:
    enabled: ${INGESTION_ENABLED:true}
    price-cron: "0 0 18 * * ?"
    fundamentals-cron: "0 0 2 * * ?"
    chunk-size: 50
    thread-pool-size: 5

  export:
    max-companies: 20
    max-years: 10
    timeout-seconds: 60
