<div class="flex flex-col items-center justify-center gap-4 rounded-xl border border-dashed border-gray-300 bg-white px-6 py-14 text-center">
  <div class="flex h-14 w-14 items-center justify-center rounded-full bg-[#1a73e8]/10 text-[#1a73e8]">
    <app-icon [name]="icon" [size]="28" />
  </div>
  <div class="max-w-sm">
    <h3 *ngIf="title" class="text-lg font-semibold text-gray-900">{{ title }}</h3>
    <p *ngIf="message" class="mt-1 text-sm text-gray-500">{{ message }}</p>
  </div>
  <button
    *ngIf="actionLabel"
    type="button"
    class="btn btn-primary"
    (click)="action.emit()"
  >
    {{ actionLabel }}
  </button>
</div>
