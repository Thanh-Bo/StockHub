<div class="flex flex-col items-center justify-center gap-3">
  <svg
    class="animate-spin text-[#1a73e8]"
    [style.width.px]="diameter"
    [style.height.px]="diameter"
    viewBox="0 0 24 24"
    fill="none"
    role="status"
    aria-label="Loading"
  >
    <circle
      class="opacity-20"
      cx="12"
      cy="12"
      r="10"
      stroke="currentColor"
      stroke-width="4"
    ></circle>
    <path
      class="opacity-90"
      fill="currentColor"
      d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
    ></path>
  </svg>
  <p *ngIf="message" class="text-sm text-gray-500">{{ message }}</p>
</div>
