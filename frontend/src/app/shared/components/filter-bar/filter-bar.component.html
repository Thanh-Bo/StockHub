<div class="flex flex-wrap items-center gap-2">
  <ng-container *ngFor="let filter of filters; let i = index">
    <div class="relative">
      <button
        type="button"
        class="btn btn-outline"
        [class.border-[#1a73e8]]="
          filter.type === 'range'
            ? filterValues[filter.field] !== filter.min
            : filterValues[filter.field]?.length > 0
        "
        [class.text-[#1a73e8]]="
          filter.type === 'range'
            ? filterValues[filter.field] !== filter.min
            : filterValues[filter.field]?.length > 0
        "
        (click)="toggleMenu(i)"
      >
        {{ getFilterLabel(filter) }}
        <app-icon name="arrow_drop_down" [size]="16" />
      </button>

      <div
        *ngIf="openMenuIndex === i"
        class="absolute left-0 z-40 mt-1 w-72 rounded-lg border border-gray-200 bg-white p-4 shadow-lg"
        (click)="$event.stopPropagation()"
      >
        <!-- Range filter -->
        <ng-container *ngIf="filter.type === 'range'">
          <div class="flex items-center justify-between">
            <span class="text-sm font-medium text-gray-700">{{ filter.label }}</span>
            <span class="text-sm font-semibold text-gray-900">
              {{ filterValues[filter.field] }}
            </span>
          </div>
          <input
            type="range"
            class="mt-3 w-full accent-[#1a73e8]"
            [min]="filter.min || 0"
            [max]="filter.max || 100"
            step="1"
            [value]="filterValues[filter.field]"
            (input)="onRangeChange(filter.field, +($any($event.target).value))"
          />
        </ng-container>

        <!-- Select filter -->
        <ng-container *ngIf="filter.type === 'select'">
          <div class="mb-2 text-sm font-medium text-gray-700">{{ filter.label }}</div>
          <label
            *ngFor="let opt of filter.options"
            class="flex cursor-pointer items-center gap-2 py-1 text-sm text-gray-700"
          >
            <input
              type="checkbox"
              class="h-4 w-4 rounded border-gray-300 accent-[#1a73e8]"
              [checked]="filterValues[filter.field]?.includes(opt.value)"
              (change)="onCheckboxChange(filter.field, opt, $any($event.target).checked)"
            />
            {{ opt.label }}
          </label>
        </ng-container>
      </div>
    </div>
  </ng-container>

  <button
    *ngIf="hasActiveFilters()"
    type="button"
    class="btn btn-ghost text-red-600"
    (click)="onClearAll()"
  >
    Clear All ({{ getActiveCount() }})
  </button>
</div>
