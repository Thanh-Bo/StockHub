<div class="relative overflow-hidden rounded-lg border border-gray-200 bg-white">
  <div *ngIf="loading" class="absolute inset-0 z-10 flex items-center justify-center bg-white/70">
    <app-loading-spinner [diameter]="40" />
  </div>

  <div class="overflow-x-auto">
    <table class="w-full min-w-full text-left text-sm">
      <thead class="sticky top-0 z-[1] bg-gray-50 text-xs uppercase tracking-wide text-gray-500">
        <tr>
          <th
            *ngFor="let col of columns"
            scope="col"
            class="whitespace-nowrap px-4 py-3 font-medium"
            [class.cursor-pointer]="sortable"
            [class.cursor-default]="!sortable"
            (click)="onHeaderClick(col.field)"
          >
            <span class="inline-flex items-center gap-1 select-none">
              {{ col.header }}
              <span *ngIf="sortable && activeSort === col.field" class="text-[#1a73e8]">
                {{ sortDirection === 'asc' ? '↑' : sortDirection === 'desc' ? '↓' : '' }}
              </span>
            </span>
          </th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <tr *ngFor="let row of data" class="transition-colors hover:bg-gray-50">
          <td
            *ngFor="let col of columns"
            class="whitespace-nowrap px-4 py-3 tabular-nums text-gray-700"
            [class.text-right]="col.align === 'right'"
            [class.text-center]="col.align === 'center'"
          >
            {{ getCellValue(row, col) }}
          </td>
        </tr>
        <tr *ngIf="!loading && data.length === 0">
          <td [attr.colspan]="columns.length" class="px-4 py-10 text-center text-sm text-gray-500">
            No data available
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
