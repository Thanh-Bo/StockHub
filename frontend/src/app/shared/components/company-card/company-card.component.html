<div
  class="group cursor-pointer rounded-xl border border-gray-200 bg-white p-5 shadow-sm transition hover:border-[#1a73e8]/40 hover:shadow-md"
  [routerLink]="['/stocks', ticker]"
  role="link"
  tabindex="0"
>
  <div class="flex items-start justify-between gap-3">
    <div class="flex min-w-0 flex-col">
      <span class="text-base font-bold text-gray-900">{{ ticker | tickerFormat }}</span>
      <span class="truncate text-sm text-gray-500">{{ name }}</span>
    </div>
    <span class="shrink-0 rounded-full bg-[#1a73e8]/10 px-2.5 py-1 text-xs font-medium text-[#115293]">
      {{ sector }}
    </span>
  </div>
  <div class="mt-4 flex items-end justify-between">
    <div>
      <span class="text-lg font-semibold text-gray-900">${{ price.toFixed(2) }}</span>
      <span
        class="ml-2 text-sm font-medium"
        [ngClass]="{
          'text-green-600': priceChangePercent > 0,
          'text-red-600': priceChangePercent < 0,
          'text-gray-500': priceChangePercent === 0
        }"
      >
        {{ priceChangePercent | stockPercent }}
      </span>
    </div>
    <span class="text-sm text-gray-500">{{ marketCap | bigNumber }}</span>
  </div>
</div>
