<div
  class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm transition"
  [class.border-t-4]="trend !== 'neutral'"
  [class.border-t-green-500]="trend === 'up'"
  [class.border-t-red-500]="trend === 'down'"
>
  <div class="flex items-center justify-between gap-2">
    <span class="truncate text-sm font-medium text-gray-500">{{ label }}</span>
    <app-icon
      *ngIf="tooltip"
      name="info"
      [size]="14"
      class="shrink-0 cursor-help text-gray-400"
      [attr.title]="tooltip"
    />
  </div>
  <div class="mt-2 flex items-center gap-2">
    <span class="text-2xl font-semibold tabular-nums text-gray-900">{{ formattedValue }}</span>
    <app-icon
      *ngIf="trend !== 'neutral'"
      [name]="trendIcon"
      [size]="18"
      class="shrink-0"
      [class.text-green-500]="trend === 'up'"
      [class.text-red-500]="trend === 'down'"
    />
  </div>
</div>
