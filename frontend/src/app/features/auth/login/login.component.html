<div class="flex min-h-[70vh] items-center justify-center px-4 py-10">
  <div class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-8 shadow-sm">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-gray-900">Welcome Back</h1>
      <p class="mt-1 text-sm text-gray-500">Sign in to your StockHub account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-8 space-y-5">
      <div>
        <label class="label" for="email">Email</label>
        <div class="relative">
          <app-icon
            name="mail"
            [size]="16"
            class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"
          />
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            autocomplete="email"
            class="input pl-10"
          />
        </div>
        <p *ngIf="f['email'].touched && f['email'].hasError('required')" class="mt-1 text-xs text-red-600">Email is required</p>
        <p *ngIf="f['email'].touched && f['email'].hasError('email')" class="mt-1 text-xs text-red-600">Please enter a valid email</p>
      </div>

      <div>
        <label class="label" for="password">Password</label>
        <div class="relative">
          <app-icon
            name="lock"
            [size]="16"
            class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"
          />
          <input
            id="password"
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
            class="input pl-10 pr-10"
          />
          <button
            type="button"
            class="absolute right-2 top-1/2 -translate-y-1/2 rounded p-1 text-gray-400 transition hover:text-gray-600"
            (click)="hidePassword = !hidePassword"
            tabindex="-1"
            aria-label="Toggle password visibility"
          >
            <app-icon [name]="hidePassword ? 'visibility_off' : 'visibility'" [size]="18" />
          </button>
        </div>
        <p *ngIf="f['password'].touched && f['password'].hasError('required')" class="mt-1 text-xs text-red-600">Password is required</p>
      </div>

      <button type="submit" class="btn btn-primary w-full py-2.5" [disabled]="submitting">
        <app-loading-spinner *ngIf="submitting" [diameter]="20" />
        <span *ngIf="!submitting">Sign In</span>
      </button>
    </form>

    <div class="my-6 flex items-center gap-3">
      <span class="h-px flex-1 bg-gray-200"></span>
      <span class="text-xs text-gray-400">or continue with</span>
      <span class="h-px flex-1 bg-gray-200"></span>
    </div>

    <button type="button" class="btn btn-outline w-full py-2.5" (click)="onGoogleLogin()">
      <svg class="h-4 w-4" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <p class="mt-6 text-center text-sm text-gray-500">
      Don't have an account?
      <a routerLink="/auth/register" class="font-medium text-[#1a73e8] hover:underline">Sign up</a>
    </p>
  </div>
</div>
