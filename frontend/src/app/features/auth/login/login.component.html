<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title class="login-title">Welcome Back</mat-card-title>
      <mat-card-subtitle class="login-subtitle">Sign in to your StockHub account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="you@example.com" autocomplete="email" />
          <mat-icon matPrefix>mail</mat-icon>
          <mat-error *ngIf="f['email'].hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="f['email'].hasError('email')">Please enter a valid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="current-password" />
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword" tabindex="-1">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="f['password'].hasError('required')">Password is required</mat-error>
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" class="submit-btn full-width" [disabled]="submitting">
          <app-loading-spinner *ngIf="submitting" [diameter]="20" />
          <span *ngIf="!submitting">Sign In</span>
        </button>
      </form>

      <div class="divider-section">
        <mat-divider></mat-divider>
        <span class="divider-text">or continue with</span>
        <mat-divider></mat-divider>
      </div>

      <button mat-stroked-button class="google-btn full-width" type="button" (click)="onGoogleLogin()">
        <img src="assets/icons/google.svg" alt="Google" class="google-icon" />
        <span>Continue with Google</span>
      </button>
    </mat-card-content>

    <mat-card-footer>
      <p class="footer-text">
        Don't have an account?
        <a routerLink="/auth/register" class="register-link">Sign up</a>
      </p>
    </mat-card-footer>
  </mat-card>
</div>
